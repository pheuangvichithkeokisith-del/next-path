version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: pathai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pathai_user
      POSTGRES_PASSWORD: pathai_password
      POSTGRES_DB: pathai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathai_user -d pathai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pathai-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://pathai_user:pathai_password@db:5432/pathai_db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ENVIRONMENT: production
      DEBUG: "false"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
